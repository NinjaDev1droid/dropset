# Runs every test, then publishes the website to GitHub Pages and Netlify.
# If any test fails, the live site is left as it was.
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test tools
        working-directory: tests
        run: npm ci
      - name: Run tests
        working-directory: tests
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: ./scripts/build-site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  # Also publishes the same site to Netlify (https://dropset-101.netlify.app).
  # Needs the NETLIFY_AUTH_TOKEN repo secret; skipped if it isn't set.
  deploy-netlify:
    needs: test
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: d46d1ced-4bf8-40a8-909f-d070edfac319
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: env.NETLIFY_AUTH_TOKEN != ''
        with:
          node-version: 22
      - name: Build site
        if: env.NETLIFY_AUTH_TOKEN != ''
        run: ./scripts/build-site.sh
      - name: Deploy to Netlify
        if: env.NETLIFY_AUTH_TOKEN != ''
        run: npx -y netlify-cli@26 deploy --dir=_site --prod --no-build --message "${{ github.sha }}"
