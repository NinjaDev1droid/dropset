# Runs every test, then publishes the website to GitHub Pages.
# Netlify deploys separately via its GitHub link (see netlify.toml).
# If any test fails, the live site is left as it was.
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install test tools
        working-directory: tests
        run: npm ci
      - name: Run tests
        working-directory: tests
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm test

  # Build and deploy are separate jobs (as in GitHub's Pages template): if they
  # share a job, deploy can look for the uploaded files before GitHub lists them.
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build site
        run: ./scripts/build-site.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

